[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsa-qr-ticket"
version = "0.1.0"
description = "Offline QR ticket verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "segno>=1.6",
    "zxing-cpp>=3.0",
    "Pillow>=10",
]

[project.scripts]
rsa-qr-tickets = "qrticket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
